<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>더 풀필 AI 물류상담</title>
<meta name="description" content="CJ대한통운 풀필먼트 더 풀필 · 예상 물류비 계산과 입점 상담">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#0020C5; --mid:#2D7AE6; --light:#25C9F5; --navy:#000037;
  --ink:#141a33; --ink2:#4a5170; --ink3:#7b8199; --line:#e3e6ef; --bg:#f4f6fb; --card:#fff;
  --tint:#eef2ff; --tint2:#e8f8fe; --warn:#b45309; --warnbg:#fff7e6; --bad:#b42318; --ok:#067647;
  --r:14px; --shadow:0 1px 2px rgba(0,0,55,.06),0 6px 24px rgba(0,0,55,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{overflow:hidden}
body{overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);background:var(--bg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--blue)}

/* ── 헤더 (75° 사선 모티프) */
.top{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(75deg,transparent 0 46px,rgba(37,201,245,.10) 46px 48px,transparent 48px 96px);
  -webkit-mask:linear-gradient(90deg,transparent 35%,#000 100%);mask:linear-gradient(90deg,transparent 35%,#000 100%)}
.top .in{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--blue);display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.mark::before{content:"";position:absolute;width:7px;height:46px;background:var(--light);transform:rotate(15deg);left:16px;top:-6px}
.mark b{position:relative;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand .t1{font-weight:800;letter-spacing:.04em;font-size:13px;color:#b8c4ff}
.brand .t2{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.beta{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(37,201,245,.18);color:var(--light);border:1px solid rgba(37,201,245,.45);margin-left:4px;vertical-align:2px}
.top .sp{flex:1}
.top .reset{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.top .reset:hover{background:rgba(255,255,255,.08)}
.testbar{background:repeating-linear-gradient(75deg,#fff3c4 0 14px,#ffeaa1 14px 28px);color:#6b4a00;font-size:12.5px;text-align:center;padding:5px 12px;font-weight:600}

/* ── 본문 배치 */
.top,.testbar{flex:none}
.wrap{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;padding:18px 20px 0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border-radius:var(--r) var(--r) 0 0;box-shadow:var(--shadow);border:1px solid var(--line);border-bottom:0}
.log{flex:1;overflow-y:auto;padding:22px 22px 10px;scroll-behavior:smooth}
.row{display:flex;gap:10px;margin:0 0 14px;align-items:flex-start}
.row.me{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue);flex:none;position:relative;overflow:hidden;margin-top:2px}
.av::before{content:"";position:absolute;width:5px;height:40px;background:var(--light);transform:rotate(15deg);left:13px;top:-5px}
.bubble{max-width:min(620px,86%);padding:11px 15px;border-radius:4px 16px 16px 16px;background:var(--tint);white-space:pre-line}
.row.me .bubble{background:var(--blue);color:#fff;border-radius:16px 4px 16px 16px}
.bubble .who{display:block;font-size:12px;font-weight:700;color:var(--blue);margin-bottom:2px}
.bubble .ph{background:#fff1c2;border-radius:4px;padding:0 3px;color:#7a5200;font-weight:600}
.bubble .testnote{display:block;margin-top:8px;padding-top:7px;border-top:1px dashed #c7cff3;font-size:12px;color:var(--ink3);white-space:normal}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mid);opacity:.35;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:1;transform:translateY(-2px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px 40px}
.chip{border:1px solid #c9d2f7;background:#fff;color:var(--blue);border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer;font-weight:600;text-align:left}
.chip:hover{background:var(--tint)}
.chip.ghost{color:var(--ink2);border-color:var(--line);font-weight:500}
.chip.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.pri:hover{background:#0019a0}
.chips.used{opacity:.55;pointer-events:none}
.sys{font-size:12.5px;color:var(--ink3);text-align:center;margin:4px 0 14px}

/* ── 대화 속 카드 (견적·연락처·예약) */
.panel{margin:0 0 16px 40px;max-width:min(640px,calc(100% - 40px));border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.panel .ph{padding:12px 16px;background:linear-gradient(105deg,var(--navy) 0 70%,var(--blue) 70%);color:#fff;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel .ph small{font-weight:500;opacity:.75;font-size:12px}
.panel .pb{padding:16px}
.panel.done{opacity:.7}
.panel.done .pb{pointer-events:none}
.f{margin:0 0 14px}
.f:last-child{margin-bottom:0}
.f > label,.f .lab{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.req{color:var(--bad);margin-left:2px}
.f input[type=text],.f input[type=email],.f input[type=tel],.f input[type=url],.f input[type=number],.f select,.f textarea{
  width:100%;border:1px solid #cfd4e3;border-radius:10px;padding:10px 12px;background:#fff;outline:none;min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--mid);box-shadow:0 0 0 3px rgba(45,122,230,.15)}
.f .hint{font-size:12.5px;color:var(--ink3);margin-top:5px}
.f.err input,.f.err .opts{border-color:var(--bad)!important}
.f .emsg{font-size:12.5px;color:var(--bad);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px}
.opts{display:flex;flex-wrap:wrap;gap:7px;border-radius:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-block;border:1px solid #cfd4e3;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;background:#fff;min-height:40px;line-height:1.5}
.opt span small{display:block;font-size:11.5px;color:var(--ink3);line-height:1.3}
.opt input:checked + span{border-color:var(--blue);background:var(--tint);color:var(--blue);font-weight:700;box-shadow:inset 0 0 0 1px var(--blue)}
.opt input:focus-visible + span{outline:2px solid var(--mid);outline-offset:2px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.quick button{border:1px dashed #c9d2f7;background:#fff;border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--blue);cursor:pointer}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;min-height:44px}
.btn:hover{background:#0019a0}
.btn:disabled{background:#aab3d6;cursor:not-allowed}
.btn.sub{background:#fff;color:var(--blue);border:1px solid #c9d2f7}
.btn.sub:hover{background:var(--tint)}

/* 동의 */
.consent{border:1px solid var(--line);border-radius:12px;background:#fafbff;padding:10px 12px;margin-top:4px}
.cline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.cline input{width:18px;height:18px;accent-color:var(--blue);flex:none}
.cline label{flex:1;cursor:pointer}
.cline .view{border:0;background:none;color:var(--mid);text-decoration:underline;font-size:13px;cursor:pointer;white-space:nowrap}
.cline.all{border-bottom:1px solid var(--line);font-weight:700;padding-bottom:9px;margin-bottom:3px}

/* 결과 */
.result{padding:18px 18px 16px;position:relative;overflow:hidden}
.result::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:140px;pointer-events:none;
  background:repeating-linear-gradient(75deg,transparent 0 18px,rgba(37,201,245,.16) 18px 21px)}
.result .k{font-size:13px;color:var(--ink2);font-weight:700}
.result .big{font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.25;margin:2px 0 4px}
.result .big em{font-style:normal;color:var(--blue)}
.result .per{font-size:15px;font-weight:700;color:var(--ink)}
.result .meta{font-size:12.5px;color:var(--ink3);margin-top:8px}
.result .warnline{margin-top:10px;background:var(--warnbg);color:#7a4a00;border-radius:8px;padding:8px 10px;font-size:13px}
.result.locked .big,.result.locked .per{filter:blur(7px);user-select:none}
.lockmsg{font-size:13.5px;color:var(--ink2);margin-top:10px}
.lockmsg b{color:var(--blue)}

/* ── 입력창 */
.composer{border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;background:#fff}
.composer input{flex:1;border:1px solid #cfd4e3;border-radius:99px;padding:11px 16px;outline:none;min-height:46px;min-width:0}
.composer input:focus{border-color:var(--mid);box-shadow:0 0 0 3px rgba(45,122,230,.15)}
.composer button{border:0;border-radius:99px;background:var(--blue);color:#fff;font-weight:700;padding:0 20px;cursor:pointer;min-height:46px}
.disclaim{font-size:11.5px;color:var(--ink3);text-align:center;padding:0 14px 8px;background:#fff}

/* ── 요약 패널 */
.side{min-height:0;overflow-y:auto;padding-bottom:20px}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sum h2{margin:0;font-size:14px;padding:13px 16px;background:var(--navy);color:#fff;position:relative;overflow:hidden}
.sum h2::after{content:"";position:absolute;right:-10px;top:-20px;width:60px;height:90px;background:repeating-linear-gradient(75deg,transparent 0 9px,rgba(37,201,245,.35) 9px 11px)}
.steps{display:flex;gap:4px;padding:14px 16px 4px;list-style:none;margin:0}
.steps li{flex:1;text-align:center;font-size:11.5px;color:var(--ink3);position:relative;padding-top:12px}
.steps li::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:9px;background:#e3e6ef}
.steps li.on{color:var(--blue);font-weight:700}
.steps li.on::before{background:linear-gradient(90deg,var(--blue),var(--light))}
.sum dl{margin:0;padding:8px 16px 16px;display:grid;grid-template-columns:76px 1fr;gap:8px 10px;font-size:13.5px}
.sum dt{color:var(--ink3)}
.sum dd{margin:0;font-weight:600}
.sum .rng{color:var(--blue);font-weight:800}
.sum .blur{filter:blur(5px)}
.sum .acts{padding:0 16px 16px;display:grid;gap:8px}
.sum .acts .btn{width:100%}
.side .info{font-size:12.5px;color:var(--ink3);padding:12px 4px}
.mbar{display:none}

/* ── 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:min(86vh,720px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,40,.3)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;display:flex;justify-content:space-between;align-items:center}
.modal .mh button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink3);line-height:1}
.modal .mb{padding:16px 20px;overflow-y:auto;font-size:14px}
.modal .mb h4{margin:14px 0 6px;font-size:14px;color:var(--navy)}
.modal .mb h4:first-child{margin-top:0}
.modal table{width:100%;border-collapse:collapse;font-size:13.5px}
.modal th,.modal td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.modal th{background:#f6f7fb;width:30%;font-weight:700;color:var(--ink2)}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal .note{font-size:12.5px;color:var(--ink3);margin-top:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}

/* ── 모바일 */
@media (max-width:960px){
  .wrap{grid-template-columns:1fr;padding:0;gap:0}
  .top .in{padding:10px 14px}
  .testbar{font-size:11.5px;padding:4px 10px}
  .side{display:none}
  .chat{border-radius:0;border:0}
  .mbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
  .mbar b{color:var(--blue)}
  .mbtn{border:1px solid #c9d2f7;background:var(--tint);color:var(--blue);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .mbar .sp{flex:1}
  .log{padding:16px 12px 8px}
  .bubble{max-width:88%}
  .chips{margin-left:0}
  .panel{margin-left:0;max-width:100%}
  .grid2,.grid3{grid-template-columns:1fr}
  .grid3.keep{grid-template-columns:repeat(3,1fr)}
  .brand .t2{font-size:15px}
  .brand .t1{display:none}
  .result .big{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}

/* ── v1.1 추가: 탭·대화기록·FAQ·이어지는 질문·요약 */
.tabs{display:flex;gap:4px;background:#e7eaf4;border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:13.5px;color:var(--ink2);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,55,.12)}
.sheet-h{display:none}
.qabox{border-top:1px solid var(--line);margin:0 16px 14px;padding-top:12px}
.qa-h{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.qa-h span{color:var(--blue);margin-left:2px}
.qa-empty{font-size:12.5px;color:var(--ink3);margin:0}
.qa-i{display:block;width:100%;text-align:left;border:0;background:#f6f7fb;border-radius:8px;padding:7px 9px;margin:0 0 5px;font-size:12.5px;line-height:1.45;cursor:pointer;color:var(--ink)}
.qa-i:hover{background:var(--tint)}
.qa-i b{color:var(--blue)}
.qa-i span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink3);margin-top:2px}
.qa-more{border:0;background:none;color:var(--mid);font-size:12.5px;cursor:pointer;padding:2px 0;text-decoration:underline}
.linkbtn{border:0;background:none;color:var(--mid);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.faq{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.faq-top{padding:12px 12px 8px;background:linear-gradient(105deg,var(--tint) 0 75%,var(--tint2) 75%)}
.faq-h{font-size:12.5px;font-weight:800;color:var(--navy);margin:0 0 6px 4px}
.faq-q{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:13.5px;cursor:pointer;color:var(--ink);line-height:1.45}
.faq-q:hover{background:#fff;color:var(--blue)}
.faq-q.asked{color:var(--ink3)}
.faq-q.asked::after{content:" ✓";color:var(--ok)}
.faq-g{border-top:1px solid var(--line)}
.faq-g summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.faq-g summary::-webkit-details-marker{display:none}
.faq-g summary span{font-size:12px;color:var(--ink3);font-weight:600;background:#f1f3f9;border-radius:99px;padding:1px 8px}
.faq-g summary::after{content:"▾";color:var(--ink3);margin-left:8px}
.faq-g[open] summary::after{content:"▴"}
.faq-g[open] summary{color:var(--blue)}
.faq-g .faq-q{padding-left:18px}
.faq-g[open]{padding-bottom:6px}
.rel-lab{font-size:12px;color:var(--ink3);margin:-6px 0 6px 40px;font-weight:600}
.rel-lab::before{content:"↳ "}
.chip.rel{border-style:dashed;font-weight:500;background:#fbfcff;color:var(--ink)}
.chip.rel:hover{border-color:var(--blue);color:var(--blue)}
.row.flash .bubble{box-shadow:0 0 0 3px var(--light);transition:box-shadow .3s}
.sumrng{font-size:20px;font-weight:800;color:var(--blue);margin:2px 0 4px}
.sumlist{margin:0;padding-left:18px}
.qalist{margin:0;padding-left:20px}
.qalist li{margin-bottom:8px}
.qalist span{color:var(--ink2)}
@media (max-width:960px){
  .rel-lab{margin-left:0}
  .mbar{flex-wrap:wrap;row-gap:4px}
  body.sheet .side{display:block;position:fixed;inset:0;z-index:40;background:var(--bg);padding:0 14px 20px;overflow-y:auto}
  body.sheet .sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px;font-weight:800;position:sticky;top:0;background:var(--bg);z-index:1}
  .sheet-h button{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ink2)}
}
.bubble .shortans{display:block;margin:0 0 8px;padding:8px 10px;background:#eef3ff;border-left:3px solid var(--blue);border-radius:6px;font-weight:700;color:var(--navy);white-space:normal}
.bubble .parthd{display:block;margin:0 0 6px;font-size:12.5px;font-weight:700;color:var(--blue)}
.bubble .whynote{display:block;margin-top:8px;padding-top:7px;border-top:1px dashed #c7cff3;font-size:11.5px;color:#6b7280;white-space:normal;font-variant-numeric:tabular-nums}
.chip.link{border-style:dashed}
.fixline{display:block;margin:-4px 4px 8px 15%;font-size:12px;color:#5b6474;text-align:right}
.bubble .preans{display:block;margin:0 0 8px;padding:8px 10px;background:#f4f6fb;border-left:3px solid #9aa8d6;border-radius:6px;font-size:13.5px;white-space:normal}
.bubble .preans b{display:block;font-size:12px;color:var(--blue);margin-bottom:2px}
.opt-tag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:9px;background:#eef1f6;color:#5b6474;font-size:11px;font-weight:600;vertical-align:1px}
.hint.store-tip{color:#2f3d66;background:#f2f6ff;border-radius:6px;padding:6px 8px;margin-top:6px}

</style></head><body>
<header class="top">
  <div class="in">
    <div class="brand">
      <div class="mark" aria-hidden="true"><b>F</b></div>
      <div>
        <div class="t1">THE FULFILL</div>
        <div class="t2">더 풀필 AI 물류상담<span class="beta">베타</span></div>
      </div>
    </div>
    <div class="sp"></div>
    <button class="reset" type="button" id="resetBtn">처음부터</button>
  </div>
</header>
<div class="testbar" id="testbar" hidden>테스트 모드 · 내부 확인용 화면입니다 (운영설정 test_mode=1)</div>
<main class="wrap">
  <section class="chat" aria-label="상담 대화">

 하나요", "카톤 바코드 가리기", "박스 바코드 스티커"], "a": "상온 센터는 판매 단위별 바코드로 입출고를 관리합니다. 박스·낱개·팩처럼 판매 단위가 다른데 같은 바코드가 붙어 있으면 수량이 잘못 잡혀 가림 작업을 하며 별도 비용이 청구됩니다. 반대로 저온 센터는 카톤 박스 겉면에 내품과 같은 바코드가 붙어 있어야 하니, 센터 온도대에 맞춰 준비해 주세요.", "btn": ["입고 포장 기준", "입고 가이드 보기"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "IN-16", "cat": "입고", "sub": "택배 입고", "tgt": "공통", "q": "낱개(단수) 상품은 왜 택배 입고가 안 되나요?", "sims": ["단수는 왜 택배입고 안돼요", "낱개 택배로 보내도 돼요", "택배 입고 기준"], "a": "택배 입고는 박스마다 상품 구분과 표식(입고증·SKU 표식)이 되어 있어야 검수할 수 있어, 낱개 상품을 구분 없이 보내면 입고가 어렵습니다. 상품별로 박스를 나누고 박스마다 입고증과 SKU 표식을 붙여 보내 주세요. 세부 택배 입고 기준은 입고 가이드를 확인해 주세요.", "btn": ["입고 가이드 보기", "입고 포장 기준"], "type": "예외", "ev": "영업 확정", "short": ""}, {"id": "IN-17", "cat": "입고", "sub": "혼적", "tgt": "공통", "q": "혼적이 뭔가요?", "sims": ["혼적이 뭐에요", "여러 상품 섞어서 보내도 돼요", "한 박스에 여러 상품"], "a": "혼적은 한 팔레트나 한 박스 안에 여러 상품(SKU)이 섞인 상태입니다. 화물은 팔레트당 3개 SKU까지 혼적할 수 있고, 넘으면 별도 단가가 청구됩니다. 혼적할 때도 SKU는 세로 단위로 나눠 쌓고 입고증·표식지·랩핑 기준을 지켜야 하며, 무지 박스에는 SKU 코드 표식을 붙여 주세요. 패션 상품은 박스 안 혼적 시 박스 번호를 적어야 합니다.", "btn": ["입고 포장 기준", "입고 가이드 보기"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "OUT-17", "cat": "출고·배송", "sub": "초도 출고", "tgt": "공통", "q": "초도 입고가 끝나면 바로 출고할 수 있나요?", "sims": ["초도입고 완료되면 바로 출고 가능해요", "첫 입고 후 바로 판매", "초도 출고"], "a": "초도 입고 상품이 검수·적치를 거쳐 가용 재고로 반영되면 출고가 시작됩니다. 입고 예정 정보와 같게 12시 전에 들어온 상품은 당일 20시까지, 12~18시 입고분은 다음 날 0시까지 반영됩니다. 판매채널 연동과 상품 연결(BOM)이 끝나 있어야 주문이 자동으로 들어오니 초도 출고 전에 함께 확인해 주세요.", "btn": ["연동 절차", "입고 가이드 보기"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "BL-09", "cat": "정산", "sub": "청구 금액", "tgt": "공통", "q": "이번 달 물류비 청구 금액과 거래명세서는 어디서 확인하나요?", "sims": ["정산완료되면 거래명세서랑 계산서 금액 보내주세요", "이번달 물류비 얼마 내면 돼요", "거래명세서 주세요"], "a": "eFLEXs 정산관리 > 고객매출확인에서 정산년월을 조회한 뒤 전체 탭에서 전체 선택 후 [거래명세서]를 누르면 거래명세서와 입금계좌를 확인하실 수 있습니다. 세금계산서를 받을 이메일·연락처를 바꾸시려면 담당 영업사원에게 알려 주세요.", "btn": ["정산 가이드", "정산 내역 확인"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "OUT-18", "cat": "출고·배송", "sub": "박스", "tgt": "공통", "q": "같은 상품인데 왜 박스 크기가 다르게 나가나요?", "sims": ["왜 똑같은 품목이 박스 크기가 다르게 나가요", "박스가 매번 달라요", "박스 크기 기준"], "a": "출고 박스는 주문에 담기는 상품 수량과 합포 구성에 맞춰 센터에서 알맞은 크기로 고릅니다. 같은 상품이라도 주문 수량이나 함께 담긴 상품이 다르면 박스 크기가 달라질 수 있습니다. 같은 구성인데 박스가 다르게 나갔다면 주문번호로 CS 접수해 주세요.", "btn": ["크기 기준 보기", "CS 접수 방법"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "CT-14", "cat": "입점·계약", "sub": "계약 종료", "tgt": "공통", "q": "계약을 종료하고 싶은데 어떻게 해야 하나요?", "sims": ["계약 종료하고 싶은데 어떻게 해야 하나요", "해지하고 싶어요", "서비스 그만 쓰고 싶어요"], "a": "계약 종료는 담당 영업사원에게 종료 희망일을 알려 주시면 계약 조건(해지 통보 기간)에 따라 진행합니다. 종료 전에 남은 재고 반출, 판매채널 연동 해제, 최종 정산이 필요하며 담당자가 일정에 맞춰 안내드립니다.", "btn": ["담당자 상담", "재고 반출 방법"], "type": "협의", "ev": "영업 확정", "short": ""}, {"id": "SW-19", "cat": "전환·비교 (B형)", "sub": "FBN", "tgt": "공통", "q": "FBN(N배송)을 하면 뭐가 좋나요? 꼭 해야 하나요?", "sims": ["FBN하면 뭐가 좋아요 어떤게 다른거에요 꼭 해야해요", "N배송이 뭐예요", "네이버 풀필먼트"], "a": "FBN(Fulfillment By NAVER)은 네이버와 함께 운영하는 풀필먼트 프로그램으로, CJ대한통운 센터에서 보관·출고하면서 네이버 N배송(도착보장) 혜택을 받는 방식입니다. 도착일 안내로 구매 전환에 도움이 되고 네이버 주문이 자동 연동됩니다. 필수는 아니며, 판매채널 구성과 물량에 따라 일반 풀필먼트와 비교해 고르시면 되고 조건은 담당자가 안내드립니다.", "btn": ["도착보장 안내", "담당자 상담"], "type": "예외", "ev": "영업 확정", "short": ""}, {"id": "IF-12", "cat": "주문 연동", "sub": "수기 주문", "tgt": "공통", "q": "연동되지 않는 채널 주문은 eFLEXs에 어떻게 올리나요?", "sims": ["주문 등록 방법", "엑셀로 주문 올리기", "수기 주문 등록"], "a": "eFLEXs 주문관리 > 주문등록 > 주문등록에서 [행추가]로 한 건씩 입력하거나(필수 15개 항목), 엑셀 양식(주문등록_sample.xlsx)을 내려받아 필수 14개 항목을 채워 올리시면 됩니다. 엑셀 업로드가 안 되면 양식 서식, 코드값 입력 항목, 값 끝의 띄어쓰기를 확인해 주세요.", "btn": ["가이드북 보기", "CS 접수 방법"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "SY-11", "cat": "시스템 등록 (eFLEXs)", "sub": "상품 등록", "tgt": "공통", "q": "상품(품목) 등록 필수 항목은 무엇인가요?", "sims": ["필수 항목 보기", "품목 필수값", "상품 등록 뭐 입력해요"], "a": "품목 등록 필수 항목은 상품명, 바코드, 크기(가로·세로·높이), 무게, 보관 온도 등 11개입니다. 전체 항목과 입력 형식은 아래 [등록 가이드]에서 확인하실 수 있습니다.", "btn": ["등록 가이드", "옵션 상품 등록"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "ST-13", "cat": "보관·재고", "sub": "저온", "tgt": "공통", "q": "냉장·냉동 상품은 입고할 때 무엇을 주의해야 하나요?", "sims": ["저온 상품 유의사항", "냉동 입고 주의", "유통기한 혼적"], "a": "저온 상품은 ① 화물로만 입고(택배 불가), 15시까지 입차 시 당일 입고 처리 ② 차량 . 전표가 없으면 박스 입고로 처리되어 입고 비용이 많이 나올 수 있습니다.", "btn": ["팔레트 규격", "입고 가이드 보기"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "IN-56", "cat": "입고", "sub": "팔레트", "tgt": "공통", "q": "렌탈 팔레트 반납지(센터 코드)는 뭐라고 적나요?", "sims": ["팔레트 코드", "KPP 코드", "AJ 코드", "팔레트 반납"], "a": "안성 저온센터(신흥리 저온 네이버센터) 팔레트 코드는 KPP 241139, AJ P014235입니다. 상온센터 팔레트 코드는 배정 센터 확정 후 담당자가 안내드립니다.", "btn": ["팔레트 규격", "담당자 확인 요청"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "IN-57", "cat": "입고", "sub": "저온", "tgt": "공통", "q": "저온 입고 차량과 온도기록계는 어떻게 준비해야 하나요?", "sims": ["냉동탑차", "온도기록계", "저온 차량"], "a": "냉장·냉동 상품은 온도 유지가 가능한 냉장·냉동 탑차로 보내 주시고, 출발부터 하차까지 10분 단위로 기록되는 온도기록계 기록지를 출력해 지참해 주세요. 기준은 냉장 0~10℃(축산 -2~10℃), 냉동 -18℃ 이하이며 한 번이라도 벗어나면 즉시 회송됩니다.", "btn": ["저온 상품 유의사항"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "IN-58", "cat": "입고", "sub": "저온", "tgt": "공통", "q": "저온 상품 박스에 라벨이 없으면 바로 회송되나요?", "sims": ["라벨 없음", "표식지 없음 저온", "입고 보류"], "a": "박스 안팎에 상품 라벨이 없으면 바로 회송하지 않고 입고 보류로 처리합니다. 입고를 원하시면 별도 비용으로 추가 작업한 뒤 입고하며, 보류 기간에는 입고 오류 보관비가 월 정산에 반영됩니다. 다만 소비기한 문제는 라벨 작업이 불가해 전량 회송됩니다.", "btn": ["회송 기준 보기", "저온 상품 유의사항"], "type": "예외", "ev": "영업 확정", "short": ""}, {"id": "IN-59", "cat": "입고", "sub": "입고 운송", "tgt": "공통", "q": "센터까지 운송은 CJ에서 해주나요?", "sims": ["입고 운송", "픽업해 주나요", "센터까지 배송"], "a": "센터까지 보내는 입고 운송은 사장님께서 택배나 화물로 직접 보내시는 것이 기본입니다. 물량이 많아 입고 운송 연계가 필요하시면 담당자에게 말씀해 주세요. 가능 여부와 비용을 확인해 안내드립니다.", "btn": ["담당자 확인 요청", "입고 방법"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "IN-60", "cat": "입고", "sub": "입고 운송", "tgt": "공통", "q": "입고 차량 종류나 크기에 제한이 있나요?", "sims": ["차량 제한", "윙바디", "탑차 입고", "대형 트럭"], "a": "센터 도크에 접안해 하차할 수 있는 화물차(윙바디·탑차 등)로 보내 주세요. 센터마다 도크 위치와 진입로가 달라 대형 차량은 진입이 제한될 수 있으니, 5톤 이상 차량이나 컨테이너는 미리 담당자에게 알려 주세요.", "btn": ["센터별 입고 위치", "입고 가이드 보기"], "type": "표준", "ev": "영업 확정", "short": ""}, {"id": "IN-61", "cat": "입고", "sub": "입고 운송", "tgt": "공통", "q": "하차는 누가 하나요? 팔레트 없이 박스만 실어도 되나요?", "sims": ["하차 작업", "수작업 하차", "박스만 실어서"], "a": "팔레트 화물은 센터에서 지게차로 하차합니다. 팔레트 없이 박스를 차에 바로 실은 화물은 수작업 하     for (let i = 0; i < n; i++) {

      await answerCard(it.id, it.part || text, "답변", it.score, { label: `${"①②③"[i]} ${it.part}`, short: it.short, why: whyText(d, it), noRelated: i < n - 1, noLog: true });
    }
    track(2, { q: text, result: "답변", card: d.items.map(x => x.id).join(","), score: top.score, stage: "조합", norm, typo });
    return;
  }
  if (d.mode === "되묻기" && d.items.length) {
    const cands = d.items.map(x => x.id).join(",");
    const why = FLAGS.testMode ? "되묻기 · 후보 " + d.items.map(x => x.id + " " + x.score.toFixed(2)).join(" / ") : "";
    await addBot("정확히 이해했는지 확인하고 싶어요. 혹시 아래 질문 중 하나이신가요?", {
      plain: true, why, chips: d.items.map(r => ({ label: byId(r.id).q, fn: () => answerCard(r.id, text, "후보", r.score, { short: r.short, why: whyText({ ...d, mode: "되묻기→선택" }, r), log: { stage: "되묻기", cands, pick: r.id, norm, typo } }) }))
        .concat([{ label: "모두 아니에요 · 담당자에게 물어보기", cls: "ghost", fn: () => { track(0, { q: text, result: "되묻기 아님", card: "", score: top.score, stage: "되묻기", cands, pick: "없음", norm, typo }); onAction("담당자 확인 요청"); } }]),
    });
    track(2, { q: text, result: "확인질문", card: top.id, score: top.score, stage: "되묻기", cands, norm, typo });
    return;
  }
  S.missCount++;
  const fb = metaCard("(매칭 실패)");
  const mrow = await addBot(fmtAnswer(fb ? fb.a : "말씀하신 내용은 정확한 확인이 필요합니다. 담당자가 확인 후 연락드리겠습니다."), { card: fb, chips: fb ? cardChips(fb) : [], why: FLAGS.testMode ? "연결 · 최고 점수 " + top.score.toFixed(2) + (top.id ? " (" + top.id + ")" : "") : "" });
  addQA(text, "담당자가 확인 후 안내드릴 예정입니다.", "", mrow);
  track(2, { q: text, result: "미응답", card: "", score: top.score, stage: "연결", cands: d.items.map(x => x.id).join(","), norm, typo });
}

// ── 이어서 많이 물어보는 질문 (같은 중분류 → 같은 대분류)
function related(c, n = 3) {
  const pool = CARDS.filter(x => x.id !== c.id && !/^\(/.test(x.q) && !S.asked.has(x.id) && x.cat !== "대화 운영");
  const persona = S.type === "신규 입점" ? "A" : S.type === "물류사 전환" ? "B" : null;
  const ok = x => !persona || x.tgt === "공통" || x.tgt === persona;
  const a = pool.filter(x => x.cat === c.cat && x.sub === c.sub && ok(x)), b = pool.filter(x => x.cat === c.cat && x.sub !== c.sub && ok(x));
  return a.concat(b).slice(0, n);
}
function addRelated(c) {
  if (c.cat === "대화 운영") return;
  const list = related(c); if (!list.length) return;
  const lab = document.createElement("div"); lab.className = "rel-lab"; lab.textContent = "이어서 많이 물어보는 질문"; log().append(lab);
  addChips(list.map(x => ({ label: x.q, cls: "rel", fn: () => answerCard(x.id, x.q, "추천", 1) }))).classList.add("relchips");
}

  cats.forEach(g => g.list.sort((a, b) => (persona && (b.tgt === persona) - (a.tgt === persona)) || 0));

}

// ── 버튼 동작
async function onAction(label) {
  const act = ACTIONS[label];
  track(0, { q: label, result: "버튼", card: "", score: 0 });
  if (act === "persona") { addUser(label); return setType(label, true); }
  if (act === "quote") { addUser(label); return startQuote(); }
  if (act === "quoteCold") { addUser(label); return startQuote({ temp: "저온" }); }
  if (act === "detail") { addUser(label); return startDetail(); }
  if (act === "book") { addUser(label); return startBooking(); }
  if (act === "handoff") { addUser(label); return startHandoff(); }
  if (act === "mail") { addUser(label); return startMail(); }
  if (act === "privacy") { openConsent("pi"); return; }
  const m = BTN[label];
  if (m && m.type === "card" && byId(m.id)) { S.questions.push(label); S.qCount++; return answerCard(m.id, label, "추천", 1, { why: "버튼 연결 · " + label + " → " + m.id }); }
  if (m && m.type === "link") {
    addUser(label);
    try { window.open(m.url, "_blank", "noopener"); } catch {}
    await addBot(`${esc(m.title || label)}를 새 창으로 열었어요. 창이 열리지 않았다면 <a href="${esc(m.url)}" target="_blank" rel="noopener">여기</a>를 눌러 주세요.`);
    return;
  }
  ask(label);
}

  if (!S.quote) { await addBot("먼저 기본 조건 세 가지로 간편 견적을 낸 뒤 자세히 계산해 드릴게요.", { plain: true }); return startQuote(); }

  const q = S.quote;
  await addBot("조건을 조금 더 알려 주시면 범위를 ±10% 수준으로 좁혀 드립니다. 모르는 항목은 비워 두셔도 됩니다.", { plain: true });
  const p = addPanel("상세 견적", "모르는 항목은 비워 두세요", `
    <div class="grid2">
      <div class="f"><label for="dOrders">한 달 출고 건수</label><input id="dOrders" type="number" inputmode="numeric" value="${q.orders}"></div>
      <div class="f"><label for="dRet">한 달 반품 건수</label><input id="dRet" type="number" inputmode="numeric" placeholder="모르면 비워 두세요 (출고의 2.5%로 계산)"></div>
    </div>
    <div class="f"><span class="lab">상품 크기</span>${pickOne("dSize", SIZES.map(s => ({ v: s.k, t: s.ko, d: s.d })), q.size)}</div>
    <div class="f"><span class="lab">보관 온도</span>${pickOne("dTemp", [{ v: "상온", t: "상온" }, { v: "저온", t: "저온 (냉장·냉동)" }], q.temp)}</div>
    <div class="f"><span class="lab">포장 방식</span>${pickOne("dPack", [{ v: "단수", t: "단수", d: "주문 1건에 상품 1개" }, { v: "합포", t: "합포", d: "주문 1건에 여러 상품" }], q.pack || "합포")}</div>
    <div class="f" id="dAvgF"><label for="dAvg">주문 1건당 평균 상품 수 (합포)</label><input id="dAvg" type="number" step="0.1" min="1" value="${q.avgItems || 1.2}"></div>
    <div class="f"><span class="lab">보관 공간 (예상 수량)</span>
      <div class="grid3 keep">
        <div><input id="dPlt" type="number" inputmode="numeric" placeholder="0" aria-label="팔레트 수"><div class="hint">팔레트</div></div>
        <div><input id="dCombi" type="number" inputmode="numeric" placeholder="0" aria-label="콤비랙 칸 수"><div class="hint">콤비랙 칸</div></div>
        <div><input id="dShelf" type="number" inputmode="numeric" placeholder="0" aria-label="선반랙 칸 수"><div class="hint">선반랙 칸</div></div>
      </div><div class="hint">모르시면 비워 두세요. 출고량 기준 선반랙 칸 수로 계산합니다.</div></div>
    <div class="f"><label class="cline" style="padding:0"><input type="checkbox" id="dArr"> <span>네이버 도착보장 이용 예정</span></label></div>
    <div class="btnrow"><button class="btn" type="button" data-go>범위 좁혀서 다시 계산</button></div>`);
  const syncAvg = () => p.querySelector("#dAvgF").hidden = p.querySelector("input[name=dPack]:checked")?.value !== "합포";
  p.addEventListener("change", syncAvg); syncAvg();
  track(6);
  p.querySelector("[data-go]").addEventListener("click", async () => {
    const g = id => p.querySelector(id).value.trim(), n = id => Math.max(0, Math.round(Number(g(id)) || 0));
    const orders = n("#dOrders") || q.orders;
    let stor = { plt: n("#dPlt"), combi: n("#dCombi"), shelf: n("#dShelf") };
    if (!stor.plt && !stor.combi && !stor.shelf) stor.shelf = Math.max(5, Math.ceil(orders / 20));
    const pack = p.querySelector("input[name=dPack]:checked")?.value || "합포";

      pack, avgItems: pack === "합포" ? Math.max(1, Number(g("#dAvg")) || 1.2) : 1, stor, box: true, cush: true, arrival: p.querySelector("#dArr").checked,
      ...(g("#dRet") !== "" ? { returns: n("#dRet") } : {}) };

    addUser(`상세 조건: 월 ${won(orders)}건 · ${SIZE_KO[S.quote.size]} · ${S.quote.temp} · ${pack}${pack === "합포" ? ` ${S.quote.avgItems}개` : ""} · 보관 팔레트 ${stor.plt}/콤비 ${stor.combi}/선반 ${stor.shelf}${S.quote.arrival ? " · 도착보장" : ""}`);

  });
}

function nextChips() {
  const c = [];
  if (!S.range) c.push({ label: "예상 물류비 계산", cls: "pri", fn: () => onAction("예상 물류비 보기") });
  if (!S.booking) c.push({ label: "담당자 상담 예약", fn: () => onAction("상담 예약") });
  c.push({ label: "궁금한 점 더 물어보기", cls: "ghost", fn: () => $("#q").focus() });
  return c;
}

async function startHandoff() {

// ── 상담 예약
function bizDays() {
  const out = [], d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = 1; i <= 14; i++) { const x = new Date(d.getTime() + i * 864e5); if (x.getDay() % 6) out.push(x); }
  return out;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const DOW = "일월화수목금토";
async function startBooking() {
  if (S.booking) return addBot(`이미 ${S.booking.date} ${S.booking.slot} ${S.booking.way} 상담으로 예약되어 있습니다. 변경이 필요하시면 담당자가 연락드릴 때 말씀해 주세요.`, { plain: true });
  await addBot("담당자 상담을 예약해 드릴게요. 편하신 날짜와 방식을 골라 주세요.", { plain: true });
  const days = bizDays();
  const p = addPanel("상담 예약", "다음 영업일 ~ 2주 이내", `
    <div class="f" data-k="date"><label for="bDate">희망 날짜<span class="req">*</span></label><select id="bDate"><option value="">날짜 선택</option>${days.map(d => `<option value="${ymd(d)}">${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})</option>`).join("")}</select></div>
    <div class="f" data-k="slot"><span class="lab">시간대<span class="req">*</span></span>${pickOne("bSlot", SLOTS.map(v => ({ v, t: v })))}</div>
    <div class="f" data-k="way"><span class="lab">상담 방식<span class="req">*</span></span>${pickOne("bWay", WAYS.map(v => ({ v, t: v })), "전화")}</div>
    <div class="f"><span class="lab">상담 받고 싶은 내용 (선택)</span>${pickMany("bTop", TOPICS, S.range ? ["견적·요금"] : [])}</div>
    <div class="f"><label for="bEtc">추가로 전하실 말씀 (선택)</label><input id="bEtc" type="text" maxlength="300"></div>
    <div class="btnrow"><button class="btn" type="button" data-go>${S.consult ? "예약 접수하기" : "다음 (연락처 입력)"}</button></div>`);
  p.querySelector("[data-go]").addEventListener("click", async () => {
    clearErr(p);
    const date = p.querySelector("#bDate").value, slot = p.querySelector("input[name=bSlot]:checked")?.value, way = p.querySelector("input[name=bWay]:checked")?.value;
    let bad = false;
    if (!date) { fieldErr(p.querySelector("[data-k=date]"), "날짜를 골라 주세요."); bad = true; }
    if (!slot) { fieldErr(p.querySelector("[data-k=slot]"), "시간대를 골라 주세요."); bad = true; }
    if (!way) { fieldErr(p.querySelector("[data-k=way]"), "상담 방식을 골라 주세요."); bad = true; }
    if (bad) return;
    const topics = [...p.querySelectorAll("input[name=bTop]:checked")].map(x => x.value);
    S.booking = { date, slot, way, topics, etc: p.querySelector("#bEtc").value.trim() };
    p.classList.add("done");
    addUser(`${date} ${slot} · ${way} 상담`);
    if (!S.consult) return showContact("book");
    lockAll(true);
    try { await api("/api/update", { id: S.consult.id, key: S.consult.key, booking: S.booking, ...common() }); lockAll(false); bookingDone(); }
    catch (e) { lockAll(false); S.booking = null; p.classList.remove("done"); toast("예약을 저장하지 못했습니다: " + e.message); }
  });
}
async function bookingDone() {
  track(7, { q: "[예약] " + S.booking.date + " " + S.booking.slot + " " + S.booking.way, result: "버튼", card: "", score: 0 });
  flush();
  const b = S.booking;
  await addBot(`예약을 접수했습니다.\n· ${b.date} ${b.slot} · ${b.way} 상담\n담당자가 확인 후 연락드리며, 예약 내용은 ${S.contact.email} 로도 보내드립니다.`, { plain: true, chips: nextChips() });
}

    <tr><th>이전 목적</th><td>상담 정보의 저장 및 전송</td></tr>
    <tr><th>이전 항목</th><td>위 1번의 수집 항목</td></tr>
    <tr><th>이전 시기·방법</th><td>정보 입력 시 암호화된 네트워크로 전송</td></tr>
    <tr><th>보유 기간</th><td>위 1번과 동일</td></tr></table>
    <p class="note">국외 이전을 거부하시면 이 화면을 통한 상담을 이용하실 수 없으며, 담당자에게 직접 문의하실 수 있습니다.</p>` },
  mk: { title: "[선택] 서비스·프로모션 안내 수신 동의", html: `
    <table><tr><th>이용 목적</th><td>물류 서비스, 요금 프로모션, 세미나·행사 안내</td></tr>
    <tr><th>이용 항목</th><td>회사명, 담당자명, 이메일, 전화번호</td></tr>
    <tr><th>수신 방법</th><td>이메일, 문자</td></tr>
    <tr><th>보유·이용 기간</th><td>수집일로부터 1년 또는 동의 철회 시까지</td></tr></table>
    <p class="note">동의하지 않으셔도 상담 이용에는 제한이 없습니다. 수신을 원하지 않으시면 언제든 거부하실 수 있습니다.</p>` },
};
let modalCb = null, lastFocus = null;
function openConsent(k, cb) {
  const c = CONSENT[k]; modalCb = cb || null; lastFocus = document.activeElement;
  $("#mTitle").textContent = c.title;
  $("#mBody").innerHTML = c.html + `<p class="note">문구 버전 ${esc(FLAGS.consentVersion)}</p>`;
  $("#mFoot").innerHTML = cb ? `<button class="btn sub" type="button" data-m="0">닫기</button><button class="btn" type="button" data-m="1">동의하고 닫기</button>` : `<button class="btn" type="button" data-m="0">닫기</button>`;
  $("#mFoot").querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => closeModal(b.dataset.m === "1")));
  $("#modal").hidden = false; $("#mFoot .btn:last-child").focus();
}
function closeModal(ok) { $("#modal").hidden = true; if (modalCb) modalCb(ok); modalCb = null; lastFocus?.focus?.(); }
$("#mClose").addEventListener("click", () => closeModal(false));
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(false); });
addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(false); });

// ── 요약 패널
function renderSummary() {
  const stepOn = [S.qCount > 0 || S.step >= 2, !!S.quote, !!S.consult, !!S.booking];
  $("#steps").querySelectorAll("li").forEach((li, i) => li.classList.toggle("on", stepOn[i]));
  const q = S.quote, r = S.range;
  const rows = [["유형", S.type || "—"]];
  rows.push(["조건", q ? `월 ${won(q.orders)}건 · ${SIZE_KO[q.size]} · ${q.temp}${q.stage === "상세" ? " · " + q.pack : ""}` : "—"]);
  rows.push(["예상 물류비", r ? `<span class="rng">${man(r.low)}만 ~ ${man(r.high)}만 원</span><br><span style="font-weight:500;font-size:12.5px">건당 ${won(r.perLow)} ~ ${won(r.perHigh)}원 · ${r.stage || q.stage}</span>` : q && !S.consult ? `<span class="blur">888만 ~ 888만 원</span>` : "—", true]);
  rows.push(["예약", S.booking ? `${S.booking.date.slice(5).replace("-", "/")} ${S.booking.slot} · ${S.booking.way}` : "—"]);
  if (S.consult) rows.push(["상담번호", S.consult.id]);
  const qa = S.qa, showAll = $("#qaBox").dataset.all === "1", list = showAll ? qa : qa.slice(-5);
  $("#qaBox").innerHTML = qa.length ? `<div class="qa-h">대화 기록 <span>${qa.length}</span></div>` + list.map(x => `<button type="button" class="qa-i" data-i="${qa.indexOf(x)}"><b>Q.</b> ${esc(x.q)}<span>→ ${esc(x.a)}</span></button>`).join("") +
    (qa.length > 5 ? `<button type="button" class="qa-more">${showAll ? "최근 5개만 보기" : `전체 ${qa.length}개 보기`}</button>` : "") : `<div class="qa-h">대화 기록</div><p class="qa-empty">질문하시면 여기에 요약됩니다.</p>`;
  $("#qaBox").querySelectorAll(".qa-i").forEach(b => b.addEventListener("click", () => { const el = qa[+b.dataset.i].el; closeSheet(); if (el) { el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); } }));
  $("#qaBox").querySelector(".qa-more")?.addEventListener("click", () => { $("#qaBox").dataset.all = showAll ? "0" : "1"; renderSummary(); });
  $("#sMail").textContent = "✉ 상담 내용 메일로 받기";
  $("#sumDl").innerHTML = rows.map(([k, v, raw]) => `<dt>${k}</dt><dd>${raw ? v : esc(v)}</dd>`).join("");
  $("#sQuote").textContent = S.range ? (q && q.stage === "상세" ? "다시 계산하기" : "자세히 계산하기") : "예상 물류비 계산";
  $("#sBook").hidden = !!S.booking;
  const labels = ["상담 시작", "질문 중", "견적 입력", "연락처 입력", "연락처 완료", "상세 견적", "예약 완료"];
  $("#mStep").textContent = labels[Math.max(0, S.step - 1)] || "상담 중";
  $("#mRange").innerHTML = r ? `예상 <b>${man(r.low)}만~${man(r.high)}만 원</b>` : "";
  $("#mQuote").textContent = S.range ? "자세히 계산" : "예상 물류비";
}
$("#sQuote").addEventListener("click", () => { if (S.busy) return; onAction(S.range ? "자세히 계산하기" : "예상 물류비 보기"); });
$("#sMail").addEventListener("click", () => { if (S.busy) return; openSummary(true); });
$("#sSum").addEventListener("click", () => { if (S.busy) return; openSummary(false); });
$("#mOpen").addEventListener("click", () => openSheet("my"));
$("#mFaq").addEventListener("click", () => openSheet("faq"));
$("#sheetClose").addEventListener("click", closeSheet);
$("#mQuote").addEventListener("click", () => { if (S.busy) return; onAction(S.range ? "자세히 계산하기" : "예상 물류비 보기"); });
$("#sBook").addEventListener("click", () => { if (S.busy) return; onAction("상담 예약"); });

// ── 시작
async function greet() {
  const g = metaCard("(첫 인사)");
  await addBot(fmtAnswer(g ? g.a : "안녕하세요, 더 풀필 AI 물류상담입니다."), {
    chips: [{ label: "신규 입점", fn: () => onAction("신규 입점") }, { label: "물류사 전환", fn: () => onAction("물류사 전환") }, { label: "예상 물류비 보기", cls: "pri", fn: () => onAction("예상 물류비 보기") }],
  });
  sys("이렇게 물어보셔도 돼요");
  addChips(SAMPLES.map(s => ({ label: s, cls: "ghost", fn: () => ask(s) })));
}
function startSession() {
  S.sid = newSid(); ss.set("lt_sid", S.sid);
  Object.assign(S, { type: null, step: 1, t0: Date.now(), quote: null, range: null, consult: null, contact: null, booking: null, questions: [], qa: [], asked: new Set(), qCount: 0, missCount: 0, negQ: 0, logQ: [], lockCard: null, lastCard: null, mailCount: 0 });
  renderFaq();
  log().innerHTML = ""; renderSummary();
  track(1);
}
$("#resetBtn").addEventListener("click", () => { if (S.busy) return; beacon(); startSession(); greet(); });
$("#form").addEventListener("submit", e => { e.preventDefault(); if (S.busy) return; const v = $("#q").value.trim(); if (!v) return; $("#q").value = ""; ask(v); });

async function boot() {
  let cfg = null;
  try { cfg = await api("/api/config", null, 5000); } catch {}
  if (cfg && cfg.ok && cfg.cards && cfg.cards.length) { CARDS = cfg.cards; cardSrc = "서버 " + cfg.version; }
  else CARDS = BUILTIN;
  if (cfg && cfg.flags) FLAGS = { ...FLAGS, ...cfg.flags };
  if (cfg && cfg.match2) MATCH = { ...MATCH, ...cfg.match2 };
  Engine.build(CARDS.filter(c => !/^\(매칭 실패\)/.test(c.q)), { syn: (cfg && cfg.syn) || SYN_BUILTIN });
  document.body.classList.toggle("test", !!FLAGS.testMode);
  $("#testbar").hidden = !FLAGS.testMode;
  if (FLAGS.testMode) $("#testbar").textContent = `테스트 모드 · 내부 확인용 화면입니다 · 카드 ${CARDS.length}개 (${cardSrc})${S.source ? " · 테스트 접속" : ""}`;
  startSession(); setTab("my");
  if (S.token) api("/api/visit", { token: S.token }, 6000).then(d => { if (d && d.company) S.company = d.company; }).catch(() => {});
  await greet();
}
boot();

</script>
